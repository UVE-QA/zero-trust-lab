name: policy-check

# Structural checks on the policy template. No credential required.
#
# This is NOT the tailnet's own `tests` section -- that runs against the real
# tailnet in tailnet-check.yml, which needs a (read-only, federated) identity.
# What runs here needs nothing, so it runs everywhere, including for anyone who
# forks the repository: the mistakes visible without evaluating anything, and
# the one rule the design states absolutely -- grants by port, never `*:*`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read         # the page build reads this repository's run history
  checks: read
  pull-requests: read

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: policy template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint the policy template
        run: ./scripts/policy-lint.py

      # The evidence page parses the policy. Removing the SSH section passed
      # every check here and then broke the page build after merge, where only
      # the published site would have shown it. Building the page on the pull
      # request moves that failure to where it can be fixed (D-052).
      - name: the evidence page still builds from this policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/evidence_page.py --out /tmp/page-check
