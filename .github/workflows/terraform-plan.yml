name: terraform-plan

# PLANS the AWS stack. It cannot apply, and that is the design.
#
# No access key: the job assumes a role by presenting an OIDC token, and the
# role trusts exactly one subject. The role it assumes holds read permissions
# plus writes to this stack's state prefix -- nothing that can create or change
# infrastructure.
#
# Applying is done by a person, from a terminal, after reading the plan. That
# follows from there being no approval gate here: a role that can create IAM
# roles unattended, with nobody required to look, is a worse trade than typing
# a command. Revisit when the repository is public and a required reviewer
# becomes available.
#
# The `environment:` below is what makes that subject match. It is `aws-plan`,
# with no reviewer, because a plan changes nothing and should not need one.
#
# The apply lives in `aws-apply`, which does require a reviewer, and its role
# trusts only that environment. Keeping the two apart is the point: while both
# used one environment, any job running there could have assumed the apply
# role and the review would have been decorative (D-055).

on:
  workflow_dispatch:
  # Weekly, so "the cloud matches its code" on the evidence page stays a
  # current reading rather than a months-old one. A plan changes nothing.
  schedule:
    - cron: "37 6 * * 1"
  # And on every pull request that touches the stack, so a change is planned
  # before it is merged. Note what that trusts: a plan executes code from the
  # branch (an `external` data source runs a program), with this job's
  # read-only cloud role. Pull requests from forks cannot obtain the OIDC
  # token at all; branches in this repository can only be pushed by its
  # collaborators. That is the boundary, and it is stated rather than assumed.
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform-plan.yml

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token; nothing else needs it

# WHY SECRETS AND NOT VARIABLES for the account id, the state bucket and the
# role ARN -- all three carry the account id, and none of them is secret in the
# usual sense.
#
# Repository *variables* are printed in workflow logs verbatim. This repository
# is private today and is intended to become public (D-035), and run logs become
# readable when it does. A value that is merely awkward today would be published
# then, retroactively, from logs nobody thinks to review.
#
# Secrets are masked wherever they appear in log output -- including inside
# Terraform's own output, which prints bucket names and ARNs freely. So the
# masking is doing real work here, not ceremony.
#
# The region stays a variable: it is genuinely public and masking it would make
# logs harder to read for no gain.

concurrency:
  group: terraform-plan
  cancel-in-progress: true

jobs:
  terraform:
    name: plan
    runs-on: ubuntu-latest
    environment: aws-plan
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: confirm which identity is in scope
        run: aws sts get-caller-identity --query Arn --output text

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: init
        working-directory: terraform/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -backend-config="key=zero-trust-lab/aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: plan
        working-directory: terraform/aws
        run: |
          terraform plan -input=false \
            -var="account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="profile=" \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="tfstate_bucket=${{ secrets.TFSTATE_BUCKET }}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="github_owner_id=${{ github.repository_owner_id }}" \
            -var="github_repo_id=${{ github.repository_id }}" \
            -var="github_oidc_provider_exists=true" \
            -var="collector_ca_certificate_pem=${{ secrets.COLLECTOR_CA_CERTIFICATE_PEM }}"

      # One claim on the evidence page is that nobody has a long-lived key in
      # this account: no IAM users, no root access keys. Counted here, with the
      # same read-only role, and published as numbers only -- no name of any
      # principal leaves this job. Skipped on pull requests: the page reads
      # this from main.
      - name: count the account's IAM principals
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p cloud-identity
          users=$(aws iam list-users --query 'length(Users)' --output text)
          root_keys=$(aws iam get-account-summary --query 'SummaryMap.AccountAccessKeysPresent' --output text)
          groups=$(aws iam get-account-summary --query 'SummaryMap.Groups' --output text)
          mfa=$(aws iam get-account-summary --query 'SummaryMap.MFADevices' --output text)
          printf '{"read_at":"%s","iam_users":%s,"root_access_keys":%s,"groups":%s,"mfa_devices":%s}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$users" "$root_keys" "$groups" "$mfa" \
            | tee cloud-identity/aggregate.json

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: cloud-identity
          path: cloud-identity/
          retention-days: 90
