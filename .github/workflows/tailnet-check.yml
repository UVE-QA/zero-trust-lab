name: tailnet-check

# The tailnet's own `tests` section, evaluated by the real tailnet on every
# change to the policy -- and a check that the policy in force is the one on
# main.
#
# No credential is stored. The job's GitHub OIDC token is exchanged for a
# short-lived Tailscale API token through a trust credential that matches this
# repository's exact subject for the `tailnet-read` environment. The token
# carries `policy_file:read` plus the two device reads the console bundles
# with it: enough to validate a proposed policy and read the live one, not
# enough to change anything. There is no write path in CI at all; a person
# applies (D-041).
#
# The four values the template needs arrive as environment secrets. They are
# masked by Actions and redacted again by the script before anything prints.

on:
  pull_request:
    paths:
      - policy/**
      - scripts/render-policy.py
      - scripts/tailnet-api.py
      - .github/workflows/tailnet-check.yml
  push:
    branches: [main]
    paths:
      - policy/**
      - scripts/render-policy.py
      - scripts/tailnet-api.py
      - .github/workflows/tailnet-check.yml
  schedule:
    # Daily. Catches an edit made directly in the console, which no push
    # would ever trigger.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailnet-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: tailnet tests (validate, read-only)
    # Every trigger, the daily schedule included: the evidence page reports
    # this job's latest result on main, so it has to keep producing one.
    runs-on: ubuntu-latest
    environment: tailnet-read
    permissions:
      contents: read
      id-token: write
    env:
      # Not secret by Tailscale's definition, but held as secrets so they are
      # masked: a variable is printed verbatim in every step's log (D-043).
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
      POLICY_VALUE_ACTUATOR_GRANTED: ${{ secrets.POLICY_VALUE_ACTUATOR_GRANTED }}
      POLICY_VALUE_ACTUATOR_CONTROL: ${{ secrets.POLICY_VALUE_ACTUATOR_CONTROL }}
      POLICY_VALUE_OPERATOR_IDENTITY: ${{ secrets.POLICY_VALUE_OPERATOR_IDENTITY }}
      POLICY_VALUE_TEST_IDENTITY: ${{ secrets.POLICY_VALUE_TEST_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: render from environment secrets
        run: ./scripts/render-policy.py --from-env
      - name: validate against the real tailnet (does not apply)
        run: ./scripts/tailnet-api.py validate policy/.rendered/policy.hujson

  drift:
    name: policy in force matches main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: tailnet-read
    permissions:
      contents: read
      id-token: write
    env:
      # Not secret by Tailscale's definition, but held as secrets so they are
      # masked: a variable is printed verbatim in every step's log (D-043).
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
      POLICY_VALUE_ACTUATOR_GRANTED: ${{ secrets.POLICY_VALUE_ACTUATOR_GRANTED }}
      POLICY_VALUE_ACTUATOR_CONTROL: ${{ secrets.POLICY_VALUE_ACTUATOR_CONTROL }}
      POLICY_VALUE_OPERATOR_IDENTITY: ${{ secrets.POLICY_VALUE_OPERATOR_IDENTITY }}
      POLICY_VALUE_TEST_IDENTITY: ${{ secrets.POLICY_VALUE_TEST_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: render from environment secrets
        run: ./scripts/render-policy.py --from-env
      - name: compare with the policy in force
        run: ./scripts/tailnet-api.py drift policy/.rendered/policy.hujson

      # A grant that names an address is only kept while a route to that
      # address is approved -- and approval lives in the console, changes with
      # a click, and says nothing when it goes. That is how the household lost
      # remote access for two weeks with every check green (D-073, D-074).
      #
      # The route file holds real addresses, so it is written here, read here,
      # and never uploaded. The check prints prefix lengths and node names
      # only.
      - name: every granted address still has an approved route
        if: ${{ !cancelled() }}
        run: |
          ./scripts/tailnet-api.py routes routes/routes.json
          ./scripts/routes_check.py policy/.rendered/policy.hujson routes/routes.json

      # Counts only -- nodes by role, OS and state, routes by prefix length --
      # for the public evidence page, which holds no tailnet credential of its
      # own and reads this artifact instead. The file is swept before upload:
      # an artifact of a public repository can be downloaded by anyone.
      - name: count the network (aggregates only)
        if: ${{ !cancelled() }}
        run: ./scripts/tailnet-api.py inventory tailnet-aggregate/aggregate.json

      - name: sweep the aggregate before it is uploaded
        if: ${{ !cancelled() }}
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          LEAK_SWEEP_EXTRA_DIR: tailnet-aggregate
        run: ./scripts/leak-sweep.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tailnet-aggregate
          path: tailnet-aggregate/aggregate.json
          retention-days: 14
