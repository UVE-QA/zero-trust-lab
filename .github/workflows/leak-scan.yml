name: leak-scan

# The repository refuses a bad commit rather than relying on someone
# remembering. Same principle as the policy `tests` section.
#
# The repository is public. Nothing containing a real hostname, address,
# account id or device model may be committed at any point -- in a file or in
# a commit message. Git history is permanent, and on GitHub so are a pull
# request's commits, so there is no "sanitise it later".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the action enumerates the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      # Pinned to a commit, not a moving tag. A repo whose purpose is
      # disclosure hygiene should not run an unpinned third-party action over
      # its full history.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  disclosure-sweep:
    name: disclosure sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commit messages are swept too, so history is needed

      - name: sweep tracked files and commit messages for real-world values
        env:
          # Newline-separated site-specific strings: device names, the
          # tailnet name, ssids, the household surname. Held as a repository
          # secret so the denylist itself never enters the repo. On a pull
          # request from a fork it is empty, and the sweep fails rather than
          # silently skipping it.
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Every commit a pull request would bring in -- they stay public on
          # the PR even after a squash merge (D-043) -- or every commit a push
          # to main added.
          case "$EVENT" in
            pull_request) export LEAK_SWEEP_COMMITS="origin/$BASE_REF..$PR_HEAD" ;;
            push) [ "${BEFORE#0000000}" != "$BEFORE" ] || export LEAK_SWEEP_COMMITS="$BEFORE..$AFTER" ;;
          esac
          ./scripts/leak-sweep.sh
