name: leak-scan

# The repository refuses a bad commit rather than relying on someone
# remembering. Same principle as the policy `tests` section.
#
# This repo is private today and intended to become public. Nothing
# containing a real hostname, address, account id or device model may be
# committed at any point -- git history is permanent, so there is no
# "sanitise it later".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  disclosure-sweep:
    name: disclosure sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sweep tracked files for real-world values
        env:
          # Newline-separated site-specific strings: device names, the
          # tailnet name, ssids, the household surname. Held as a repository
          # secret so the denylist itself never enters the repo.
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: ./scripts/leak-sweep.sh
