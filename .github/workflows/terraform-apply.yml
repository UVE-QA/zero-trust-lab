name: terraform-apply

# Applies the AWS stack. No access key: the job assumes a role by presenting
# an OIDC token, and the role trusts exactly one subject --
# repo:OWNER/REPO:environment:<this environment>.
#
# The `environment:` below is what makes that subject match, AND what allows a
# required reviewer to gate the apply. Removing it does not merely loosen the
# gate: the token's subject stops matching and the role refuses the assume.
# The approval and the credential are the same mechanism, which is why this
# cannot be quietly bypassed.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token; nothing else needs it

concurrency:
  group: terraform-apply
  cancel-in-progress: false   # never interrupt an apply

jobs:
  terraform:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: aws-apply
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: confirm which identity is in scope
        run: aws sts get-caller-identity --query Arn --output text

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: init
        working-directory: terraform/aws
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=zero-trust-lab/aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: plan
        working-directory: terraform/aws
        run: |
          terraform plan -input=false \
            -var="account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -var="profile=" \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="tfstate_bucket=${{ vars.TFSTATE_BUCKET }}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="github_oidc_provider_exists=true"

      - name: apply
        if: inputs.action == 'apply'
        working-directory: terraform/aws
        run: |
          terraform apply -input=false -auto-approve \
            -var="account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -var="profile=" \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="tfstate_bucket=${{ vars.TFSTATE_BUCKET }}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="github_oidc_provider_exists=true"
